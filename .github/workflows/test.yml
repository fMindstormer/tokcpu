name: test
on: [push, pull_request]

env:
  # onnxruntime-node's install script downloads CUDA binaries the runners cannot use (no GPU); the CPU
  # binaries ship in the npm package. 1.21, which transformers.js 3.x wants, downloaded them from
  # microsoft/onnxruntime's GitHub releases, which return 404 since 2026-11-18, so fuzz/ and tests/
  # override it with 1.30.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: tests
      - run: npm ci
        working-directory: fuzz
      - run: python -m pytest tests -rs
