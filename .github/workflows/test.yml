name: test
on: [push, pull_request]

env:
  # onnxruntime-node 1.21 (under transformers.js 3.x) downloads CUDA binaries from microsoft/onnxruntime's
  # GitHub releases, which return 404 since that repo left GitHub (2026-11-18). The runners have no GPU,
  # and the CPU binaries ship in the npm package.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: tests
      - run: npm ci
        working-directory: fuzz
      - run: python -m pytest tests -rs
